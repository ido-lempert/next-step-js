<h2 mat-dialog-title>Delete Script</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete the script <strong>{{ data.script.name }}</strong>?
  </p>
  <p class="warning">
    This action cannot be undone. All steps associated with this script will also be deleted.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading()">
    Cancel
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()" [disabled]="loading()">
    Delete
  </button>
</mat-dialog-actions>
