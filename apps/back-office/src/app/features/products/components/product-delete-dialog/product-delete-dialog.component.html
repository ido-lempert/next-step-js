<h2 mat-dialog-title>
  <mat-icon color="warn">warning</mat-icon>
  Delete Product
</h2>

<mat-dialog-content>
  <p>Are you sure you want to delete the product <strong>{{ data.product.name }}</strong>?</p>
  <p class="warning-text">This action cannot be undone.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading()">Cancel</button>
  <button
    mat-raised-button
    color="warn"
    (click)="onConfirm()"
    [disabled]="loading()"
  >
    @if (loading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Delete
    }
  </button>
</mat-dialog-actions>
